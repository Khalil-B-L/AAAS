[[entry]]
id = 1
type = "story"
title = "Outillage de tests partagé"
description = "Extrait les helpers de test dupliqués de l'epic 1 (API : validation de démarrage, redémarrage d'hôte, requêtes et assertions d'erreur, faux serveur SMTP dans son propre fichier, AuthTests scindé ; front : fixtures utilisateur et « connecter comme ») et ramène les gardes de démarrage à un seul style, sans changer aucun comportement testé."
