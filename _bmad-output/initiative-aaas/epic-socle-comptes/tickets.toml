title = "Comptes côté API"
description = "Ajoute l'entité User (téléphone E.164 obligatoire), POST inscription et connexion, GET /api/auth/moi, JWT avec claims sub et role (MapInboundClaims=false, RoleClaimType), ClaimsPrincipalExtensions.UserId(), policy Admin, OnChallenge 401 et OnForbidden 403 au format ApiErrors, et le seed admin depuis la configuration."
