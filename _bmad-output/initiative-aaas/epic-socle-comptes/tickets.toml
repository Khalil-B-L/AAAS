# tickets.toml — stories de l'epic « Socle et comptes », dans l'ordre de build.

[[entry]]
id = 1
type = "story"
title = "Squelette API, web et tests de bout en bout"
description = "Crée aaas/api (Aaas.Api + Aaas.Api.Tests xunit.v3) et aaas/web (ng new 22), le proxy, un AppDbContext vide avec migration appliquée au démarrage, TimeProvider en DI, GET /api/site lu depuis la config (placeholders marqués) et core/SiteService affichant le numéro dans un pied de page minimal ; harnais de tests (WebApplicationFactory, LocalDB jetable, environnement Testing, FakeTimeProvider) et Vitest."
verify = "ng serve affiche le numéro venu de /api/site via le proxy ; dotnet test et ng test passent sur une base LocalDB jetable."
covers = ["E1"]
after = []
hitl = true
risk = "medium"
references = ["architecture-aaas-adoption/architecture-aaas-adoption.md#stack", "architecture-aaas-adoption/architecture-aaas-adoption.md#structural-seed"]
notes = []

[[entry]]
id = 2
type = "story"
title = "Briques communes backend"
description = "Ajoute ICommandHandler/IQueryHandler avec enregistrement DI, Result<T> et ToHttpResult, ApiErrors avec MapFallback 404 et 500 du gestionnaire d'exceptions, TransactionRunner, conventions DateTimeOffset UTC, convertisseur JSON Z, JsonStringEnumConverter global et Common/LiensFront."
verify = "Tests d'intégration : format d'erreur 404 et 500, suffixe Z et énumération en texte prouvés via un endpoint déclaré uniquement dans la factory de tests."
covers = ["E1"]
after = [1]
hitl = false
risk = "low"

